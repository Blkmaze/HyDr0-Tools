name: hydr0_tools
description: Standalone APK installer for Fire TV/Android. Paste a direct download URL, it fetches the file and hands it to Android's own installer. Ships empty -- no built-in app list, no codes, no catalog.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  open_filex: ^4.3.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.2
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

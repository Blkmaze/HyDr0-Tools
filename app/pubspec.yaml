name: hydr0_tools
description: Maze-Tools -- a self-hosted APK storefront for Fire TV/Android. Browse your own Maze-Tools Store catalog by Featured/Categories, or enter a code/paste a direct URL for anything else. Ships empty -- no seeded catalog, no store configured until you point it at your own backend.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  open_filex: ^4.3.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.2
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  qr_flutter: ^4.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
